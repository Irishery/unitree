planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    costmap_update_timeout: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.35
      use_astar: false
      allow_unknown: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      # Includes the torso and arm swing envelope; intentionally larger than
      # the pelvis footprint used in simulation.
      robot_radius: 0.45
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.55
          obstacle_max_range: 8.0
          raytrace_min_range: 0.55
          raytrace_max_range: 9.0
          max_obstacle_height: 1.8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.60
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
